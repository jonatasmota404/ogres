# Compose file used by Coolify (rpg.jonatas.pro).
services:
  backend:
    build:
      context: .
      dockerfile: ./deploy/backend.dockerfile
    environment:
      OGRES_HOST: "0.0.0.0"
    expose:
      - "8090"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: ./deploy/coolify.dockerfile
      args:
        SERVER_SOCKET_URL: "wss://rpg.jonatas.pro/ws"
        VERSION: "latest"
    environment:
      BACKEND_URL: "http://backend:8090/ws"
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
